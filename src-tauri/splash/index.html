<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kite</title>
    <style>
      html, body { margin: 0; height: 100%; background: #232323; color: #a3a3a3; font: 13px system-ui, sans-serif; }
      body { display: grid; place-items: center; }
      p { animation: fade 1.2s ease-in-out infinite alternate; }
      @keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }
    </style>
  </head>
  <body>
    <p id="status">Starting Kite…</p>
  </body>
</html>
