<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kite</title>
    <!-- Shown until the bundled server is up (lib.rs `boot`), so nothing here can load from anywhere.
         lib.rs writes failures into #status: keep that id. Add #dawn, #day, #golden or #night to the
         address to preview an hour. -->
    <script>
      (function () {
        var hash = location.hash.slice(1);
        var d = new Date(), m = d.getHours() * 60 + d.getMinutes();
        // The same hours as lib/sky.ts, so the app opens on the sky the splash just showed.
        document.documentElement.dataset.sky = /^(dawn|day|golden|night)$/.test(hash)
          ? hash
          : m >= 300 && m < 450 ? "dawn" : m >= 450 && m < 1020 ? "day" : m >= 1020 && m < 1140 ? "golden" : "night";
      })();
    </script>
    <style>
      :root { --sky-1: #3f7fcb; --sky-2: #5e9bd9; --sky-3: #8dbde9; --sky-4: #b8d7f1; --ink: 12 30 60; }
      :root[data-sky="dawn"] { --sky-1: #46679f; --sky-2: #7f98c8; --sky-3: #d9b2b4; --sky-4: #f6cfb4; --ink: 45 40 80; }
      :root[data-sky="golden"] { --sky-1: #34558f; --sky-2: #6f86bd; --sky-3: #dfa48e; --sky-4: #f3c28e; --ink: 50 35 70; }
      :root[data-sky="night"] { --sky-1: #0b1424; --sky-2: #12203a; --sky-3: #1d3253; --sky-4: #2c466d; --ink: 0 5 20; }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 38%, var(--sky-3) 74%, var(--sky-4) 100%);
        color: #fff;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        cursor: default;
        user-select: none;
      }
      canvas, .grain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .grain { opacity: 0.05; mix-blend-mode: overlay; }

      main {
        position: fixed;
        inset: 54% 24px auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      h1 {
        margin: 0;
        font: italic 400 clamp(64px, 12.5vmin, 124px) / 1 Constantia, Georgia, serif;
        letter-spacing: -0.02em;
        text-shadow: 0 1px 2px rgb(var(--ink) / 0.18), 0 10px 44px rgb(var(--ink) / 0.42);
        animation: rise 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
      }
      /* A pill of the sky's own ink: the sky and clouds behind it can be nearly white. */
      .pill {
        margin: 16px 0 0;
        max-width: 420px;
        padding: 6px 14px;
        border-radius: 16px;
        background: rgb(var(--ink) / 0.58);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        font-size: 13px;
        font-weight: 500;
        line-height: 1.45;
        letter-spacing: 0.02em;
        animation: rise 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
      }
      #status {
        color: transparent;
        background: linear-gradient(100deg, rgb(255 255 255 / 0.62) 38%, #fff 50%, rgb(255 255 255 / 0.62) 62%) 100% 0 / 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        animation: sweep 2.6s linear 1.4s infinite;
      }
      #status[data-failed] { color: #fff; background: none; animation: none; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); filter: blur(12px); }
      }
      @keyframes sweep { to { background-position: -50% 0; } }
      @media (prefers-reduced-motion: reduce) {
        h1, .pill, #status { animation: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="grain" id="grain" aria-hidden="true"></div>
    <main>
      <h1>Kite</h1>
      <p class="pill"><span id="status" role="status">Starting Kite</span></p>
    </main>

    <script>
      (function () {
        var phase = document.documentElement.dataset.sky;
        var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        var canvas = document.getElementById("sky");
        var ctx = canvas.getContext("2d");
        var TAU = Math.PI * 2;

        var LOOK = {
          day: { lit: "255,255,255", shade: "150,186,226", glow: "255,255,255", glowAt: [0.84, 0.13], glowSize: 0.5, glowAlpha: 0.75, stars: 0 },
          dawn: { lit: "255,240,226", shade: "166,136,172", glow: "255,214,176", glowAt: [0.74, 0.86], glowSize: 0.85, glowAlpha: 0.75, stars: 0.12 },
          golden: { lit: "255,224,190", shade: "128,112,160", glow: "255,186,120", glowAt: [0.78, 0.84], glowSize: 0.9, glowAlpha: 0.8, stars: 0 },
          night: { lit: "86,112,158", shade: "20,34,60", glow: "176,202,255", glowAt: [0.82, 0.17], glowSize: 0.42, glowAlpha: 0.2, stars: 1 },
        }[phase];

        var W, H, dpr, size, clouds, front, stars, flyer, home, nodes, born;
        var rand = function (a, b) { return a + Math.random() * (b - a); };

        // Fine grain, so the gradient reads as sky rather than a flat fill.
        (function () {
          var tile = document.createElement("canvas");
          tile.width = tile.height = 160;
          var g = tile.getContext("2d");
          var noise = g.createImageData(160, 160);
          for (var i = 0; i < noise.data.length; i += 4) {
            noise.data[i] = noise.data[i + 1] = noise.data[i + 2] = Math.random() * 255;
            noise.data[i + 3] = 255;
          }
          g.putImageData(noise, 0, 0);
          document.getElementById("grain").style.backgroundImage = "url(" + tile.toDataURL() + ")";
        })();

        function puff(color) {
          var c = document.createElement("canvas");
          c.width = c.height = 128;
          var g = c.getContext("2d");
          var r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
          r.addColorStop(0, "rgba(" + color + ",1)");
          r.addColorStop(0.45, "rgba(" + color + ",0.55)");
          r.addColorStop(1, "rgba(" + color + ",0)");
          g.fillStyle = r;
          g.fillRect(0, 0, 128, 128);
          return c;
        }
        var LIT = puff(LOOK.lit), SHADE = puff(LOOK.shade);

        // One cloud: a flat-bottomed heap of soft puffs, shaded underneath and lit from above.
        function makeCloud(w, h) {
          var c = document.createElement("canvas");
          // At least a pixel: a window that opens at no size must not leave an undrawable sprite.
          c.width = Math.max(1, Math.ceil(w));
          c.height = Math.max(1, Math.ceil(h));
          var g = c.getContext("2d");
          var puffs = [];
          var count = Math.round(w / 7) + 16;
          for (var i = 0; i < count; i++) {
            var t = Math.random();
            var body = Math.pow(Math.sin(Math.PI * t), 0.75);
            var r = h * (0.07 + 0.2 * body * Math.random() + 0.05 * body);
            // Kept inside the sprite, so no puff is cut off in a straight line.
            puffs.push({
              x: Math.min(w - r * 1.35, Math.max(r * 1.35, w * (0.1 + 0.8 * t))),
              y: Math.max(r * 1.45, h * 0.74 - Math.pow(Math.random(), 1.5) * body * h * 0.46),
              r: r,
            });
          }
          puffs.sort(function (a, b) { return a.y - b.y; });
          puffs.forEach(function (p) {
            g.globalAlpha = 0.5;
            g.drawImage(SHADE, p.x - p.r * 1.3, p.y + p.r * 0.1 - p.r * 1.3, p.r * 2.6, p.r * 2.6);
          });
          puffs.forEach(function (p) {
            var high = 1 - p.y / (h * 0.74);
            g.globalAlpha = 0.34 + high * 0.6;
            g.drawImage(LIT, p.x - p.r, p.y - p.r * 0.4 - p.r, p.r * 2, p.r * 2);
          });
          // Dissolve the base rather than cutting it.
          g.globalCompositeOperation = "destination-out";
          g.globalAlpha = 1;
          var fade = g.createLinearGradient(0, h * 0.62, 0, h * 0.96);
          fade.addColorStop(0, "rgba(0,0,0,0)");
          fade.addColorStop(1, "rgba(0,0,0,1)");
          g.fillStyle = fade;
          g.fillRect(0, 0, w, h);
          return c;
        }

        function cloudLayer(n, w, h, yFrom, yTo, speed, alpha) {
          var list = [];
          for (var i = 0; i < n; i++) {
            var cw = w * rand(0.75, 1.25);
            var ch = h * rand(0.8, 1.2);
            list.push({
              sprite: makeCloud(cw * 0.5, ch * 0.5), // Half size: scaling up keeps them soft, and cheap.
              w: cw,
              h: ch,
              x: ((i + rand(0.1, 0.9)) / n) * (W + cw) - cw,
              y: H * rand(yFrom, yTo),
              speed: speed * rand(0.85, 1.15),
              alpha: alpha,
            });
          }
          return list;
        }

        function build() {
          dpr = Math.min(devicePixelRatio || 1, 2);
          W = innerWidth;
          H = innerHeight;
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          size = Math.max(30, Math.min(W, H) * 0.075);
          flyer = { x: W * 0.02, y: H * 1.06 };
          home = { x: W * 0.59, y: H * 0.27 };
          var u = Math.min(W, H);
          clouds = cloudLayer(4, u * 0.5, u * 0.16, 0.5, 0.66, 3.5, phase === "night" ? 0.5 : 0.72)
            .concat(cloudLayer(3, u * 0.85, u * 0.28, 0.12, 0.42, 6.5, phase === "night" ? 0.55 : 0.85));
          // In front of the kite and the string: the bank the string disappears into, and one thin
          // cloud the kite slips behind now and then.
          front = cloudLayer(1, u * 0.8, u * 0.2, 0.15, 0.2, 11, 0.5)
            .concat(cloudLayer(5, u * 1.25, u * 0.42, 0.72, 0.84, 13, 1));
          stars = [];
          var count = Math.round((W * H) / 3600 * LOOK.stars);
          for (var i = 0; i < count; i++) {
            stars.push({ x: Math.random() * W, y: Math.pow(Math.random(), 1.4) * H * 0.72, r: rand(0.35, 1.25), a: rand(0.25, 0.95), w: rand(0.4, 1.8), p: rand(0, TAU) });
          }
          nodes = [];
          for (var n = 0; n < 15; n++) nodes.push({ x: home.x, y: home.y + n, px: home.x, py: home.y + n });
        }

        function drawGlow() {
          var x = W * LOOK.glowAt[0], y = H * LOOK.glowAt[1], r = Math.max(W, H) * LOOK.glowSize;
          var g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, "rgba(" + LOOK.glow + "," + LOOK.glowAlpha + ")");
          g.addColorStop(0.3, "rgba(" + LOOK.glow + "," + LOOK.glowAlpha * 0.28 + ")");
          g.addColorStop(1, "rgba(" + LOOK.glow + ",0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
          if (phase === "night") {
            var m = Math.max(16, Math.min(W, H) * 0.036);
            ctx.fillStyle = "#eef3ff";
            ctx.shadowColor = "rgba(190,212,255,0.9)";
            ctx.shadowBlur = m * 1.6;
            ctx.beginPath();
            ctx.arc(x, y, m, 0, TAU);
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }

        function drawClouds(list, dt) {
          for (var i = 0; i < list.length; i++) {
            var c = list[i];
            c.x += c.speed * dt;
            if (c.x > W + 20) c.x = -c.w - 20;
            ctx.globalAlpha = c.alpha;
            ctx.drawImage(c.sprite, c.x, c.y, c.w, c.h);
          }
          ctx.globalAlpha = 1;
        }

        // Where the kite is: a slow climb out of the bank, then the wind's overlapping sways.
        function pose(t) {
          var p = Math.min(1, t / 2.8);
          var climb = 1 - Math.pow(1 - p, 4);
          var sx = Math.sin(t * 0.53) * 0.6 + Math.sin(t * 1.27 + 1) * 0.28 + Math.sin(t * 2.9) * 0.07;
          var sy = Math.sin(t * 0.71 + 2) * 0.55 + Math.sin(t * 1.61) * 0.3;
          var from = { x: flyer.x + (home.x - flyer.x) * 0.3, y: flyer.y + (home.y - flyer.y) * 0.3 };
          return {
            x: from.x + (home.x - from.x) * climb + sx * size * 0.75 * climb,
            y: from.y + (home.y - from.y) * climb + sy * size * 0.5 * climb,
            // Leans into the wind, and rolls with the way it's moving.
            tilt: 0.42 + (Math.cos(t * 0.53) * 0.2 + Math.cos(t * 1.27 + 1) * 0.14 + Math.sin(t * 2.3) * 0.035),
            flex: 0.93 + Math.sin(t * 1.9) * 0.05,
          };
        }

        function stepTail(from, t) {
          var seg = size * 0.27;
          var gust = 0.04 + Math.sin(t * 0.8) * 0.008 + Math.sin(t * 2.3) * 0.005;
          var last = nodes.length - 1;
          for (var i = 1; i <= last; i++) {
            var n = nodes[i];
            var vx = (n.x - n.px) * 0.94, vy = (n.y - n.py) * 0.94;
            n.px = n.x;
            n.py = n.y;
            n.x += vx + gust * size;
            n.y += vy + 0.007 * size + Math.sin(t * 7 - i * 0.75) * 0.008 * size * (i / last + 0.2);
          }
          nodes[0].x = from.x;
          nodes[0].y = from.y;
          for (var k = 0; k < 4; k++) {
            for (var j = 1; j <= last; j++) {
              var a = nodes[j - 1], b = nodes[j];
              var dx = b.x - a.x, dy = b.y - a.y;
              var d = Math.sqrt(dx * dx + dy * dy) || 1;
              var off = (d - seg) / d;
              if (j > 1) { a.x += dx * off * 0.5; a.y += dy * off * 0.5; b.x -= dx * off * 0.5; b.y -= dy * off * 0.5; }
              else { b.x -= dx * off; b.y -= dy * off; }
            }
          }
        }

        function drawString(k) {
          var midX = (flyer.x + k.x) / 2, midY = (flyer.y + k.y) / 2;
          // The string sags away from the wind, and hums a little with it.
          var sag = Math.hypot(k.x - flyer.x, k.y - flyer.y) * 0.13;
          ctx.beginPath();
          ctx.moveTo(flyer.x, flyer.y);
          ctx.quadraticCurveTo(midX + sag * 0.62, midY + sag * 0.78, k.x, k.y);
          ctx.strokeStyle = phase === "night" ? "rgba(220,230,255,0.42)" : "rgba(255,255,255,0.72)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        function drawTail() {
          ctx.beginPath();
          ctx.moveTo(nodes[0].x, nodes[0].y);
          for (var i = 1; i < nodes.length - 1; i++) {
            ctx.quadraticCurveTo(nodes[i].x, nodes[i].y, (nodes[i].x + nodes[i + 1].x) / 2, (nodes[i].y + nodes[i + 1].y) / 2);
          }
          ctx.strokeStyle = "rgba(255,255,255,0.85)";
          ctx.lineWidth = 1.2;
          ctx.stroke();
          for (var b = 2; b < nodes.length; b += 3) {
            var n = nodes[b], before = nodes[b - 1];
            var angle = Math.atan2(n.y - before.y, n.x - before.x) + Math.PI / 2;
            var w = size * (0.27 - b * 0.006);
            ctx.save();
            ctx.translate(n.x, n.y);
            ctx.rotate(angle);
            ctx.fillStyle = (b - 2) % 6 === 0 ? "#ffffff" : "#8f83ff";
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-w, -w * 0.5);
            ctx.lineTo(-w, w * 0.5);
            ctx.closePath();
            ctx.moveTo(0, 0);
            ctx.lineTo(w, -w * 0.5);
            ctx.lineTo(w, w * 0.5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
        }

        // The mark from the app icon, with each panel catching the light differently.
        function drawKite(k) {
          var s = size / 10;
          ctx.save();
          ctx.translate(k.x, k.y);
          ctx.rotate(k.tilt);
          ctx.scale(s * k.flex, s);
          ctx.lineJoin = "round";
          ctx.shadowColor = phase === "night" ? "rgba(140,125,255,0.75)" : "rgba(30,25,110,0.32)";
          ctx.shadowBlur = size * 0.5;
          ctx.shadowOffsetY = phase === "night" ? 0 : size * 0.16;
          ctx.fillStyle = "#6d5efc";
          kitePath();
          ctx.fill();
          ctx.shadowColor = "transparent";
          facet("#a79eff", "#7f71ff", -8, -2, 0, -12);
          facet("#7f71ff", "#6455f4", 8, -2, 0, -12);
          facet("#6253f0", "#4a3bd8", -8, -2, 0, 12);
          facet("#5546e6", "#3b2dc2", 8, -2, 0, 12);
          ctx.strokeStyle = "rgba(255,255,255,0.86)";
          ctx.lineWidth = 0.34;
          ctx.beginPath();
          ctx.moveTo(-8, -2);
          ctx.lineTo(8, -2);
          ctx.moveTo(0, -12);
          ctx.lineTo(0, 12);
          ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255,0.5)";
          ctx.lineWidth = 0.24;
          kitePath();
          ctx.stroke();
          ctx.restore();
        }
        function kitePath() {
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(8, -2);
          ctx.lineTo(0, 12);
          ctx.lineTo(-8, -2);
          ctx.closePath();
        }
        function facet(from, to, x, y, tipX, tipY) {
          var g = ctx.createLinearGradient(x, y, tipX, tipY);
          g.addColorStop(0, from);
          g.addColorStop(1, to);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(0, -2);
          ctx.lineTo(x, y);
          ctx.lineTo(tipX, tipY);
          ctx.closePath();
          ctx.fill();
        }

        function tailStart(k) {
          var s = size / 10;
          return { x: k.x - Math.sin(k.tilt) * 12 * s, y: k.y + Math.cos(k.tilt) * 12 * s };
        }

        var last = 0, spare = 0;
        function frame(now) {
          if (!still) requestAnimationFrame(frame);
          if (!born) born = now;
          var t = (now - born) / 1000 + (still ? 30 : 0);
          var dt = Math.min(0.05, (now - last) / 1000 || 0);
          last = now;

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, W, H);
          drawGlow();
          for (var i = 0; i < stars.length; i++) {
            var st = stars[i];
            ctx.globalAlpha = st.a * (0.62 + 0.38 * Math.sin(t * st.w + st.p));
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(st.x, st.y, st.r, 0, TAU);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          drawClouds(clouds, dt);

          var k = pose(t);
          // Fixed steps, so the tail moves the same on a 60 Hz and a 144 Hz screen.
          spare += dt;
          var from = tailStart(k);
          while (spare > 1 / 60) {
            stepTail(from, t);
            spare -= 1 / 60;
          }
          drawString(k);
          drawTail();
          drawKite(k);
          drawClouds(front, dt);
        }

        function settle() {
          // Let the tail hang in the wind before the first frame shows it.
          var from = tailStart(pose(still ? 30 : 0));
          nodes.forEach(function (n) { n.x = n.px = from.x; n.y = n.py = from.y; });
          for (var i = 0; i < 200; i++) stepTail(from, i / 60);
        }

        build();
        settle();
        var timer;
        addEventListener("resize", function () {
          clearTimeout(timer);
          timer = setTimeout(function () {
            build();
            settle();
            if (still) requestAnimationFrame(frame);
          }, 120);
        });
        requestAnimationFrame(frame);

        // Anything lib.rs writes here is a failure: show it plainly, not shimmering.
        var status = document.getElementById("status");
        var patient = "Still starting. This can take a minute.";
        new MutationObserver(function () {
          if (status.textContent !== patient) status.dataset.failed = "";
        }).observe(status, { childList: true, characterData: true, subtree: true });
        setTimeout(function () {
          if (!("failed" in status.dataset)) status.textContent = patient;
        }, 15000);
      })();
    </script>
  </body>
</html>
