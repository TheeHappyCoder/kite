[package]
name = "kite"
version = "0.2.3"
description = "Kite desktop shell"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "kite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Storage_CloudFilters", "Win32_System_CorrelationVector", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Foundation", "Foundation_Collections", "Storage", "Storage_Provider", "Storage_Search", "Storage_Streams"] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
